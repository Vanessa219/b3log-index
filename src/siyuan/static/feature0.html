<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>SiYuan Interactive Showcase</title>
    <style>
        :root {
            --page-bg: #061126;
            --app-bg: #ebecf0;
            --panel-bg: #ffffff;
            --editor-bg: #ffffff;
            --surface: #f6f6f6;
            --surface-hover: rgb(0 0 0 / 7.5%);
            --surface-selected: rgb(53 117 240 / 12%);
            --border: #e0e0e0;
            --border-strong: #d2d2d2;
            --text: #222222;
            --text-soft: #5f6368;
            --text-soft-light: rgb(95 99 104 / 68%);
            --text-faint: #9aa0a6;
            --primary: #3575f0;
            --primary-soft: rgb(53 117 240 / 12%);
            --purple: #b388ff;
            --green: #65b84d;
            --phone-bg: #1e1e1e;
            --phone-surface: #2c2c2c;
            --phone-border: #484848;
            --phone-text: #dadada;
            --phone-soft: #9aa0a6;
            --radius-sm: 6px;
            --radius: 6px;
            --radius-large: 12px;
            --shadow-window: 0 30px 90px rgb(0 0 0 / 34%), 0 1px 0 rgb(255 255 255 / 70%) inset;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            align-items: center;
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 0px;
        }

        button {
            appearance: none;
            background: transparent;
            border: 0;
            color: inherit;
            cursor: pointer;
            font: inherit;
            margin: 0;
            padding: 0;
        }

        button:focus-visible {
            box-shadow: 0 0 0 2px var(--editor-bg), 0 0 0 4px var(--primary);
            outline: none;
            position: relative;
            z-index: 4;
        }

        .icon-sprite {
            height: 0;
            overflow: hidden;
            position: absolute;
            width: 0;
        }

        .ui-icon {
            display: block;
            fill: currentColor;
            height: 16px;
            pointer-events: none;
            width: 16px;
        }

        .siyuan-showcase {
            aspect-ratio: 1.72;
            max-width: 1800px;
            min-height: 650px;
            overflow: hidden;
            position: relative;
            width: 100%;
        }

        .desktop-window {
            background: var(--app-bg);
            border: 1px solid rgb(255 255 255 / 72%);
            border-radius: 15px;
            box-shadow: var(--shadow-window);
            height: 94%;
            left: 0;
            overflow: hidden;
            position: absolute;
            top: 0;
            width: 94%;
        }

        .titlebar {
            align-items: center;
            background: linear-gradient(100deg, #efe5f8 0%, #ebeef4 43%, #eceef3 100%);
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: auto auto 1fr auto;
            height: 38px;
            padding: 0 12px;
            position: relative;
        }

        .traffic-lights {
            display: flex;
            gap: 8px;
            margin-right: 16px;
        }

        .traffic-lights span {
            border: 1px solid rgb(0 0 0 / 10%);
            border-radius: 50%;
            display: block;
            height: 12px;
            width: 12px;
        }

        .traffic-lights span:nth-child(1) {
            background: #ff5f57;
        }

        .traffic-lights span:nth-child(2) {
            background: #febc2e;
        }

        .traffic-lights span:nth-child(3) {
            background: #28c840;
        }

        .brand {
            align-items: center;
            color: var(--text-soft-light);
            display: flex;
            font-size: 12px;
            gap: 5px;
            white-space: nowrap;
        }

        .brand-caret {
            color: var(--text-soft-light);
            height: 12px;
            width: 12px;
        }

        .history-actions {
            display: flex;
            gap: 0;
            margin-left: 12px;
        }

        .titlebar-button,
        .tool-button,
        .rail-button,
        .phone-button {
            align-items: center;
            border-radius: var(--radius-sm);
            color: var(--text-soft);
            display: inline-flex;
            justify-content: center;
            transition: background-color 150ms ease, color 150ms ease, transform 150ms ease;
        }

        .titlebar-button,
        .rail-button {
            color: var(--text-soft-light);
        }

        .titlebar-button {
            height: 23.5px;
            margin: 2px;
            padding: 4px;
            width: 23.5px;
        }

        .titlebar-button .ui-icon {
            height: 15.5px;
            width: 15.5px;
        }

        .titlebar-button:hover,
        .tool-button:hover,
        .rail-button:hover {
            background: rgb(0 0 0 / 6%);
            color: var(--text);
        }

        .titlebar-button:active,
        .tool-button:active,
        .rail-button:active,
        .phone-button:active {
            transform: scale(.94);
        }

        .window-title {
            color: var(--text-faint);
            font-size: 12px;
            left: 50%;
            max-width: 34%;
            overflow: hidden;
            pointer-events: none;
            position: absolute;
            text-align: center;
            text-overflow: ellipsis;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .titlebar-actions {
            align-items: center;
            display: flex;
            gap: 0;
            justify-content: flex-end;
        }

        .titlebar-decoration {
            align-items: center;
            border-radius: var(--radius);
            display: inline-flex;
            height: 23.5px;
            justify-content: center;
            margin: 2px;
            padding: 4px;
            width: 23.5px;
        }

        .titlebar-decoration .ui-icon {
            height: 15.5px;
            width: 15.5px;
        }

        .vip--annual {
            color: #f4a000;
        }

        .vip--lifetime {
            color: #5cae45;
        }

        .heart {
            color: #ea4aaa;
            font-size: 17px;
            line-height: 15.5px;
        }

        .workspace {
            display: grid;
            grid-template-columns: 42px 280px minmax(0, 1fr) 280px 42px;
            grid-template-rows: minmax(0, 1fr);
            height: calc(100% - 38px);
            min-height: 0;
            overflow: hidden;
        }

        .app-rail,
        .right-rail {
            align-items: center;
            background: #eef0f5;
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 0;
        }

        .app-rail {
            border-right: 0;
        }

        .right-rail {
            border-left: 0;
        }

        .rail-separator {
            height: 17px;
            margin-top: 7px;
            position: relative;
            width: 100%;
        }

        .rail-separator::after {
            background: var(--border-strong);
            border-radius: var(--radius);
            content: "";
            height: 1px;
            left: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 22px;
        }

        .rail-button {
            height: 26px;
            margin: 7px 7px 0;
            padding: 5px;
            width: 28px;
        }

        .rail-button .ui-icon {
            height: 16px;
            width: 17.5px;
        }

        .rail-button[aria-pressed="true"] {
            background: rgb(255 255 255 / 68%);
            box-shadow: none;
        }

        .left-panel {
            background: var(--panel-bg);
            border-right: 0;
            display: grid;
            grid-template-rows: minmax(0, 2fr) minmax(150px, .58fr);
            margin-right: 4px;
            min-height: 0;
        }

        .panel-section {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .panel-section + .panel-section {
            border-top: 1px solid var(--border);
        }

        .panel-heading {
            align-items: center;
            display: flex;
            flex: none;
            font-size: 14px;
            font-weight: 600;
            height: 42px;
            justify-content: space-between;
            padding: 0 8px;
        }

        .panel-heading > span:first-child {
            margin: 0 8px;
        }

        .panel-heading-actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 150ms ease;
        }

        .panel-heading:hover .panel-heading-actions,
        .panel-heading:focus-within .panel-heading-actions {
            opacity: 1;
        }

        .tool-button {
            height: 24px;
            padding: 4px;
            width: 24px;
        }

        .tool-button .ui-icon {
            height: 16px;
            width: 16px;
        }

        .tool-button[aria-pressed="true"] {
            background: var(--surface-selected);
            color: var(--primary);
        }

        .documents-scroll,
        .outline-list,
        .context-scroll {
            min-height: 0;
            overflow: auto;
            scrollbar-color: #c5c7cc transparent;
            scrollbar-width: thin;
        }

        .documents-scroll {
            padding: 1px 0 12px;
        }

        .notebook-row {
            align-items: center;
            border-radius: var(--radius);
            color: var(--text);
            display: flex;
            font-size: 14px;
            line-height: 28px;
            margin: 1px 8px;
            min-height: 28px;
            padding: 0 4px;
            text-align: left;
            transition: background-color 20ms ease-in, color 20ms ease-in;
            width: calc(100% - 16px);
        }

        .notebook-row {
            font-weight: 400;
        }

        .notebook-row:hover {
            background: var(--surface-hover);
        }

        .notebook-row .chevron {
            align-items: center;
            color: var(--text-soft-light);
            display: inline-flex;
            flex: 0 0 18px;
            height: 22px;
            justify-content: center;
            padding: 0 2px;
            width: 18px;
        }

        .doc-list {
            display: flex;
            flex-direction: column;
        }

        .doc-button {
            align-items: center;
            border-radius: var(--radius);
            color: var(--text);
            display: flex;
            font-size: 14px;
            line-height: 28px;
            margin: 1px 8px;
            min-height: 28px;
            padding: 0 4px 0 18px;
            text-align: left;
            transition: background-color 20ms ease-in, color 20ms ease-in;
            width: calc(100% - 16px);
        }

        .doc-button[data-depth="1"] {
            padding-left: 18px;
        }

        .doc-button[data-depth="2"] {
            padding-left: 36px;
        }

        .doc-button:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .doc-button[aria-current="page"] {
            background: var(--surface-hover);
            box-shadow: none;
            color: var(--text);
            font-weight: 400;
        }

        .doc-button .chevron {
            align-items: center;
            color: var(--text-soft-light);
            display: inline-flex;
            flex: 0 0 18px;
            height: 22px;
            justify-content: center;
            padding: 0 2px;
            width: 18px;
        }

        .chevron .ui-icon {
            height: 14px;
            transition: transform 150ms ease;
            width: 14px;
        }

        .chevron.is-expanded .ui-icon {
            transform: rotate(90deg);
        }

        .chevron.is-empty {
            visibility: hidden;
        }

        .doc-icon {
            align-items: center;
            display: inline-flex;
            flex: 0 0 28px;
            font-size: 16px;
            height: 22px;
            justify-content: center;
            line-height: 22px;
            margin-right: 4px;
            padding: 0 4px;
            text-align: center;
            width: 28px;
        }

        .doc-label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .doc-count {
            color: var(--text-soft-light);
            font-size: 14px;
            line-height: 22px;
            margin-left: 4px;
            padding: 0 8px;
        }

        .doc-button[hidden] {
            display: none;
        }

        .outline-list {
            padding: 2px 0 12px;
        }

        .outline-button {
            align-items: center;
            border-radius: var(--radius);
            color: var(--text);
            display: flex;
            font-size: 14px;
            gap: 0;
            line-height: 28px;
            margin: 1px 8px;
            min-height: 28px;
            padding: 0 4px;
            text-align: left;
            transition: background-color 150ms ease, color 150ms ease;
            width: calc(100% - 16px);
        }

        .outline-button--h3 {
            color: var(--purple);
        }

        .outline-button--root {
            gap: 4px;
        }

        .outline-toggle {
            align-items: center;
            color: var(--text-soft-light);
            display: inline-flex;
            flex: 0 0 20px;
            height: 22px;
            justify-content: center;
            margin-right: 2px;
            padding-left: 4px;
            width: 20px;
        }

        .outline-toggle--h3 {
            flex-basis: 34px;
            padding-left: 18px;
            width: 34px;
        }

        .outline-toggle.is-empty {
            visibility: hidden;
        }

        .outline-toggle .ui-icon {
            height: 14px;
            width: 14px;
        }

        .outline-button .outline-count {
            color: var(--text-soft-light);
            margin-left: auto;
            padding: 0 8px;
        }

        .outline-text--marked {
            background: #e1e2e4;
        }

        .outline-button:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .outline-button--h3:hover {
            color: var(--purple);
        }

        .outline-level {
            color: var(--text);
            flex: 0 0 18px;
            font-size: 12px;
            font-weight: 500;
            height: 22px;
            line-height: 22px;
            margin-right: 4px;
            text-align: center;
            width: 18px;
        }

        .editor-shell {
            background: var(--editor-bg);
            display: grid;
            grid-template-rows: 42px 38px minmax(0, 1fr);
            min-height: 0;
            min-width: 0;
        }

        .tabs {
            align-items: center;
            border-bottom: 1px solid var(--border);
            display: flex;
            min-width: 0;
            padding: 0 8px;
        }

        .tabs-list {
            align-items: center;
            display: flex;
            flex: 0 1 auto;
            min-width: 0;
            overflow: auto;
            scrollbar-width: none;
        }

        .tabs-list::-webkit-scrollbar {
            display: none;
        }

        .tab-button {
            align-items: center;
            border-radius: var(--radius);
            color: var(--text-soft);
            display: inline-flex;
            flex: 0 0 auto;
            font-size: 14px;
            justify-content: flex-start;
            line-height: 22px;
            margin: 6px 4px;
            max-width: 186px;
            min-height: 29px;
            min-width: 72px;
            overflow: hidden;
            padding: 0;
            position: relative;
            transition: background-color 150ms ease, color 150ms ease;
            white-space: nowrap;
        }

        .tab-button:hover {
            background: rgb(255 255 255 / 72%);
            box-shadow: 0 0 0 1px rgb(95 99 104 / 14%) inset;
            color: var(--text);
        }

        .tab-button[aria-selected="true"] {
            background: var(--surface-selected);
            box-shadow: 0 0 0 1px rgb(53 117 240 / 38%) inset;
            color: var(--text);
        }

        .tab-button[aria-selected="true"]:hover {
            background: #dce7ff;
            box-shadow: 0 0 0 1px rgb(53 117 240 / 48%) inset;
        }

        .tab-button[aria-selected="true"]::after {
            display: none;
        }

        .tab-icon {
            align-items: center;
            display: inline-flex;
            font-size: 16px;
            height: 27px;
            padding: 4px 0 4px 8px;
        }

        .tab-label {
            flex: 1;
            overflow: hidden;
            padding: 0 8px;
            text-overflow: ellipsis;
        }

        .tab-close {
            align-items: center;
            align-self: stretch;
            color: var(--text-soft-light);
            display: inline-flex;
            flex: 0 0 auto;
            padding: 7px 6px 6px 0;
        }

        .tab-close .ui-icon {
            height: 14px;
            width: 14px;
        }

        .tab-button:hover .tab-close {
            color: var(--text);
        }

        .tab-spacer {
            flex: 1;
            min-width: 4px;
        }

        .tab-bar-button {
            align-items: center;
            border-radius: var(--radius);
            color: var(--text-soft-light);
            display: inline-flex;
            flex: 0 0 24px;
            height: 24px;
            justify-content: center;
            margin: 2px;
            padding: 4px;
            transition: background-color 150ms ease, color 150ms ease;
            width: 24px;
        }

        .tab-bar-button:hover {
            background: rgb(255 255 255 / 72%);
            color: var(--text);
        }

        .tab-bar-button:active {
            transform: scale(.94);
        }

        .tab-bar-button .ui-icon {
            height: 16px;
            width: 16px;
        }

        .editor-toolbar {
            align-items: center;
            color: var(--text-soft);
            display: flex;
            font-size: 12px;
            gap: 6px;
            min-width: 0;
            padding: 0 10px;
        }

        .breadcrumb {
            align-items: center;
            display: flex;
            gap: 6px;
            min-width: 0;
        }

        .breadcrumb-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .editor-toolbar .toolbar-spacer {
            flex: 1;
        }

        .editor-scroll {
            border-radius: 0 0 var(--radius-large) var(--radius-large);
            min-height: 0;
            overflow: auto;
            scroll-behavior: smooth;
            scrollbar-color: #d0d2d7 transparent;
            scrollbar-width: thin;
            overflow-x: hidden;
        }

        .document-content {
            margin: 0;
            max-width: none;
            min-height: 100%;
            padding: 8px 34px 527px;
        }

        .document-content.is-entering {
            animation: document-enter 180ms ease-out;
        }

        .doc-cover {
            aspect-ratio: 3 / 1;
            margin: -8px -36px 0;
            overflow: hidden;
            width: calc(100% + 72px);
        }

        .doc-cover img {
            border-radius: var(--radius-large) var(--radius-large) 0 0;
            display: block;
            height: 100%;
            object-fit: cover;
            width: 100%;
        }

        .document-content.has-cover .doc-emoji {
            font-size: 96px;
            height: 110px;
            line-height: 110px;
            margin: -54px 0 72px;
            position: relative;
            z-index: 1;
        }

        @keyframes document-enter {
            from {
                opacity: .35;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .doc-emoji {
            font-size: 68px;
            height: 80px;
            line-height: 80px;
            margin: 0 0 52px;
        }

        .doc-title {
            color: #222222;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0;
            line-height: 52px;
            margin: 0 0 18px;
        }

        .doc-intro {
            color: var(--text-soft);
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .callout {
            border-left: 4px solid var(--green);
            margin: 2px 0;
            padding: 4px 4px 4px 10px;
        }

        .callout-title {
            color: var(--green);
            font-size: 16px;
            font-weight: 500;
            line-height: 26px;
            margin: 0;
        }

        .callout p {
            color: var(--text-soft);
            font-size: 16px;
            line-height: 26px;
            margin: 0;
        }

        .doc-sections {
            display: grid;
            gap: 34px;
        }

        .doc-sections--grid {
            gap: 28px 46px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .guide-grid {
            display: grid;
            gap: 0 18px;
            margin-top: 2px;
        }

        .guide-grid--2 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .guide-grid--4 {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .guide-grid--3 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .guide-link-columns,
        .guide-subsections {
            display: grid;
            gap: 0 18px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .guide-section {
            min-width: 0;
        }

        .guide-section h2 {
            color: #292a2e;
            border-radius: 6px;
            font-size: 24.8px;
            font-weight: 600;
            line-height: 40.3px;
            margin: 2px 0;
            padding: 4px;
        }

        .guide-section h3 {
            color: #292a2e;
            border-radius: 6px;
            font-size: 22.08px;
            font-weight: 600;
            line-height: 35.88px;
            margin: 2px 0;
            padding: 4px;
        }

        .guide-section p,
        .guide-section li,
        .guide-summary {
            color: var(--text-soft);
            font-size: 16px;
            line-height: 26px;
        }

        .guide-section p {
            margin: 2px 0;
            padding: 4px;
        }

        .guide-section ul {
            margin: 0;
            padding-left: 34px;
        }

        .guide-section li + li {
            margin-top: 4px;
        }

        .guide-grid--welcome .guide-section:first-child li {
            position: relative;
        }

        .guide-grid--welcome .guide-section:first-child li::after {
            border-left: 1px solid var(--border);
            bottom: 0;
            content: "";
            left: -18px;
            position: absolute;
            top: 25px;
        }

        .guide-section a {
            color: var(--purple);
            text-decoration: none;
        }

        .guide-section a:hover {
            text-decoration: underline;
        }

        .guide-section .guide-link--external {
            color: #4285f4;
        }

        .guide-heading-note {
            color: var(--text-faint);
            float: right;
            font-size: 9px;
            font-weight: 500;
            margin-top: 8px;
        }

        .guide-counted-heading {
            position: relative;
        }

        .guide-heading-sparkle {
            font-size: 11px;
            line-height: 1;
            position: absolute;
            right: 4px;
            top: -10px;
        }

        .guide-counted-heading::after {
            align-items: center;
            background: rgb(95 99 104 / 10%);
            border-radius: 50%;
            bottom: -7px;
            color: var(--text-soft-light);
            content: "1";
            display: flex;
            font-size: 9px;
            font-weight: 400;
            height: 16px;
            justify-content: center;
            line-height: 16px;
            position: absolute;
            right: -1px;
            width: 16px;
            z-index: 1;
        }

        .guide-summary {
            margin: 2px 0;
            padding: 4px;
        }

        .guide-divider {
            border: 0;

            const createChevron = (expanded = false, empty = false) => `

                    <svg class="ui-icon"><use href="#iconRight"></use></svg>

            documentTree.innerHTML = documentTreeItems.map((item) => {
                if (item.kind === "notebook") {
                    return `
                        <button class="notebook-row" type="button" data-tree-toggle="guide" aria-expanded="true">
                            ${createChevron(true)}
                            <span class="doc-icon" aria-hidden="true">${item.icon}</span>
                            <span class="doc-label">${item.title}</span>
                        </button>
                    `;
                }
                return `
                    <button class="doc-button" type="button" data-document="${item.id}" data-depth="${item.depth}" title="${item.title}" aria-current="${item.id === activeDocumentId ? "page" : "false"}"${item.id === "start" ? " aria-expanded=\"true\"" : ""}>
                        ${createChevron(item.expanded, !item.hasChildren)}
                        <span class="doc-icon" aria-hidden="true">${item.icon}</span>
                        <span class="doc-label">${item.title}</span>
                        <span class="doc-count">${item.count ?? ""}</span>
                    </button>
                `;
            }).join("");

            const notebookButton = documentTree.querySelector("[data-tree-toggle=\"guide\"]");
            notebookButton.addEventListener("click", () => {
                const expanded = notebookButton.getAttribute("aria-expanded") === "true";
                notebookButton.setAttribute("aria-expanded", String(!expanded));
                notebookButton.querySelector(".chevron").classList.toggle("is-expanded", !expanded);
                documentTree.querySelectorAll(".doc-button").forEach((button) => {
                    button.hidden = expanded;
                });
            });

            documentTree.querySelectorAll("[data-document]").forEach((button) => {
                button.addEventListener("click", (event) => {
                    const chevron = event.target.closest(".chevron");
                    if (button.dataset.document === "start" && chevron) {
                        const expanded = button.getAttribute("aria-expanded") === "true";
                        button.setAttribute("aria-expanded", String(!expanded));
                        chevron.classList.toggle("is-expanded", !expanded);
                        documentTree.querySelectorAll("[data-depth=\"2\"]").forEach((childButton) => {
                            childButton.hidden = expanded;
                        });
                        return;
                    }
                });
            });
        }

                    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") {

            document.getElementById("characterCount").textContent = item.metrics[0];
            document.getElementById("wordCount").textContent = item.metrics[1];
            document.getElementById("linkCount").textContent = item.metrics[2];
            document.getElementById("referenceCount").textContent = item.metrics[3];
        }

        document.querySelectorAll(".toggle-action").forEach((button) => {
            button.addEventListener("click", () => {
                const selected = button.getAttribute("aria-pressed") === "true";
                button.setAttribute("aria-pressed", String(!selected));
            });
        });

        document.querySelectorAll(".document-content, .phone-document").forEach((container) => {
            container.addEventListener("click", (event) => {
                if (event.target.closest("a[href='#']")) {
                    event.preventDefault();
                }
            });
        });

        createDocumentTree();
        createFixedTabs();
        renderDocument(getDocument(activeDocumentId));
        renderOutline(getDocument(activeDocumentId));
        renderContext(getDocument(activeDocumentId));
        renderPhone(getDocument(activeDocumentId));
        updateSelection(getDocument(activeDocumentId));
    </script>
</body>
</html>
